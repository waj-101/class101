<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AQA GCSE Flame Test & Firework Lab Suite</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary-dark: #0f172a;
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
            --border-color: #475569;
            --danger-red: #f43f5e;
            --success-green: #22c55e;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-light);
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            background-color: #020617;
            color: white;
            text-align: center;
            padding: 20px 10px;
            border-bottom: 3px solid var(--accent-blue);
        }

        header h1 { margin: 0; font-size: 1.6rem; color: #38bdf8; }
        header p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        .main-container {
            display: flex;
            flex-direction: column;
            max-width: 950px;
            margin: 0 auto;
            padding: 15px;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.25rem;
            color: var(--accent-blue);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .status-box {
            background-color: #0f172a;
            border-left: 5px solid var(--accent-blue);
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            color: #e2e8f0;
        }

        .lab-bench {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            background: #020617;
            padding: 30px 15px;
            border-radius: 12px;
            position: relative;
            border-bottom: 8px solid #334155;
            min-height: 400px;
        }

        .bench-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 10px;
        }

        .beaker-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 120px;
            position: relative;
        }

        .beaker {
            width: 60px;
            height: 65px;
            border: 3px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 16px 16px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            box-shadow: inset 0 -25px 0 var(--liquid-color, rgba(56, 189, 248, 0.2));
            transition: all 0.3s ease;
        }

        .beaker-label {
            color: white;
            font-size: 0.8rem;
            margin-top: 8px;
            font-weight: bold;
            text-align: center;
        }

        .formula-sub { color: #94a3b8; font-size: 0.7rem; display: block; font-weight: normal; }

        /* Bunsen Burner */
        .burner-area {
            width: 160px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px;
        }

        .burner-stem {
            width: 30px;
            height: 90px;
            background: #64748b;
            border-radius: 4px 4px 0 0;
            position: relative;
            z-index: 2;
        }

        .burner-base {
            width: 70px;
            height: 15px;
            background: #475569;
            border-radius: 4px;
            position: absolute;
            bottom: 10px;
            z-index: 1;
        }

        .bunsen-flame {
            width: 40px;
            height: 80px;
            background: radial-gradient(circle at bottom, #38bdf8 20%, rgba(56, 189, 248, 0.2) 70%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -75px;
            left: -5px;
            animation: flicker 0.15s infinite alternate;
            z-index: 3;
            mix-blend-mode: screen;
            transition: background 0.4s ease;
        }

        @keyframes flicker {
            0% { transform: scale(0.98) skewX(1deg); }
            100% { transform: scale(1.02) skewX(-1deg); }
        }

        /* Draggable Loop */
        #nichromeLoop {
            width: 12px;
            height: 140px;
            position: absolute;
            top: 40px;
            left: 40px;
            cursor: grab;
            z-index: 10;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #nichromeLoop:active { cursor: grabbing; }

        .loop-wire {
            width: 3px;
            height: 100px;
            background: #94a3b8;
        }

        .loop-tip {
            width: 14px;
            height: 14px;
            border: 3px solid #94a3b8;
            border-radius: 50%;
            background: transparent;
            margin-top: -2px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .loop-handle {
            width: 16px;
            height: 40px;
            background: #b91c1c;
            border-radius: 4px;
        }

        /* Sparkle Particle System */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            animation: burst var(--dur, 0.6s) ease-out forwards;
        }

        @keyframes burst {
            0% { transform: scale(2); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        /* Reporting Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: bold; color: var(--accent-blue); background-color: #0f172a; }
        select { padding: 8px; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border-color); width: 100%; background: #0f172a; color: white; }
       
        .btn-submit {
            background-color: #2563eb;
            color: white;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #1d4ed8; }

        /* Fireworks Bonus Section */
        .hidden-panel { display: none; margin-top: 20px; animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .firework-options { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 20px 0; }
        .fw-check { display: flex; align-items: center; gap: 8px; color: white; font-weight: bold; font-size: 0.9rem; cursor: pointer; background: #0f172a; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .fw-check input { transform: scale(1.3); cursor: pointer; }
       
        .sky-canvas {
            width: 100%;
            height: 300px;
            background: #020617;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #334155;
            cursor: pointer;
        }
        .sky-prompt { position: absolute; width: 100%; text-align: center; top: 45%; color: #64748b; font-weight: bold; font-style: italic; pointer-events: none; }
    </style>
</head>

<script>
    // --- LIVE LAB PASSWORD SECURITY SYSTEM ---
    // You can customize "FLAME2026" below to be any password you prefer.
    const secureToken = "FLAME2026";
    let accessGranted = false;

    while (!accessGranted) {
        let entryPrompt = prompt("Enter Classroom Lab Access Key:");
        if (entryPrompt === null) {
            document.body.innerHTML = "<h1 style='margin-top:120px; text-align:center; color:#f43f5e;'>Access Revoked. Refresh page to input credentials.</h1>";

            break;

            accessGranted = true;

    }

    </header>

            <div class="lab-bench" id="benchEnvironment">
               
                <!-- Cleaners Container -->
                <div class="bench-row">
